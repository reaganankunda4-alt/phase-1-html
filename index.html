<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ankunda - Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>

    <section id="home">
      <h1>Hey, I AM ANKUNDA</h1>
      <p>I AM A CS STUDENT BUILDING WEB AND MOBILE APPS.</p>
      <a href="#contact">Get in touch</a>
    </section>

    <section id="about">
      <h2>about me</h2>
      <p>I am learning the following technologies:</p>
      <ul>
        <li>HTML AND CSS</li>
        <li>javascript and type script</li>
        <li>react and next.js</li>
        <li>laravel and php</li>
      </ul>
    </section>

    <section id="contact">
      <h2>Contact Me</h2>
      <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5"></textarea>

        <button type="submit">Send</button>
      </form>
    </section>

  </main>

  <footer>
    <p>Built by Ankunda R&copy; 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
